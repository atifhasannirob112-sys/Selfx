<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#062c24" />
      <stop offset="50%" stop-color="#041e18" />
      <stop offset="100%" stop-color="#02110d" />
    </linearGradient>
    <linearGradient id="tealGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#047857" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#010907" flood-opacity="0.75" />
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#bgGrad)" />
  <circle cx="580" cy="250" r="220" fill="url(#tealGlow)" />

  <g transform="translate(470, 235) rotate(-14)">
    <!-- Career Roadmap Card -->
    <g transform="translate(-170, -100)" filter="url(#dropShadow)">
      <rect x="0" y="0" width="160" height="160" rx="36" fill="url(#cardGrad)" />
      <!-- Graduation Cap / Compass Icon -->
      <path d="M80 42 L130 66 L80 90 L30 66 Z" fill="#ffffff" />
      <path d="M52 80 V106 C52 116 108 116 108 106 V80" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" />
      <circle cx="124" cy="88" r="5" fill="#ffffff" />
      <line x1="124" y1="68" x2="124" y2="88" stroke="#ffffff" stroke-width="6" stroke-linecap="round" />
      <text x="80" y="200" text-anchor="middle" fill="#a7f3d0" font-family="sans-serif" font-weight="800" font-size="26" letter-spacing="1">CAREER</text>
    </g>

    <!-- Earn & Business Card -->
    <g transform="translate(30, -70)" filter="url(#dropShadow)">
      <rect x="0" y="0" width="160" height="160" rx="36" fill="#071f1a" stroke="#10b981" stroke-width="5" />
      <!-- Briefcase / Growth Icon -->
      <rect x="42" y="58" width="76" height="56" rx="12" fill="none" stroke="#34d399" stroke-width="8" />
      <path d="M64 58 V46 C64 41 68 38 73 38 H87 C92 38 96 41 96 46 V58" fill="none" stroke="#34d399" stroke-width="7" />
      <path d="M58 88 L74 74 L86 84 L104 66" fill="none" stroke="#fbbf24" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
      <text x="80" y="200" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-weight="800" font-size="26" letter-spacing="1">EARN &amp; AI</text>
    </g>
  </g>
</svg>
