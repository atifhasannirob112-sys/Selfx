<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b4595" />
      <stop offset="45%" stop-color="#5e2a7e" />
      <stop offset="100%" stop-color="#3c1568" />
    </linearGradient>
    <linearGradient id="screenGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d88be8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#5b2287" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="igGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffd600" />
      <stop offset="35%" stop-color="#ff543e" />
      <stop offset="70%" stop-color="#ff0069" />
      <stop offset="100%" stop-color="#b900b4" />
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#19052c" flood-opacity="0.65" />
    </filter>
  </defs>

  <!-- Base Purple Screen Surface -->
  <rect width="800" height="500" fill="url(#bgGrad)" />
  <polygon points="0,0 520,0 240,500 0,500" fill="url(#screenGlow)" />

  <!-- Tilted Phone Screen Group (-22 deg) -->
  <g transform="translate(410, 235) rotate(-22)">
    <!-- Instagram App Icon -->
    <g transform="translate(-200, -90)" filter="url(#dropShadow)">
      <rect x="0" y="0" width="160" height="160" rx="38" fill="url(#igGrad)" />
      <rect x="28" y="28" width="104" height="104" rx="28" fill="none" stroke="#ffffff" stroke-width="11" />
      <circle cx="80" cy="80" r="24" fill="none" stroke="#ffffff" stroke-width="11" />
      <circle cx="110" cy="50" r="7" fill="#ffffff" />
      <text x="80" y="205" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-weight="700" font-size="30" letter-spacing="0.5">Instagram</text>
    </g>

    <!-- TikTok App Icon -->
    <g transform="translate(40, -90)" filter="url(#dropShadow)">
      <rect x="0" y="0" width="160" height="160" rx="38" fill="#070709" />
      <!-- Cyan offset -->
      <path d="M98 40 v62 a22 22 0 1 1 -18 -21.5 v-15 a37 37 0 1 0 33 36.5 v-40 a44 44 0 0 0 26 9 v-15 a29 29 0 0 1 -26 -16 z" fill="#25f4ee" transform="translate(-4, -3)" />
      <!-- Red offset -->
      <path d="M98 40 v62 a22 22 0 1 1 -18 -21.5 v-15 a37 37 0 1 0 33 36.5 v-40 a44 44 0 0 0 26 9 v-15 a29 29 0 0 1 -26 -16 z" fill="#fe2c55" transform="translate(4, 3)" />
      <!-- White center -->
      <path d="M98 40 v62 a22 22 0 1 1 -18 -21.5 v-15 a37 37 0 1 0 33 36.5 v-40 a44 44 0 0 0 26 9 v-15 a29 29 0 0 1 -26 -16 z" fill="#ffffff" />
      <text x="80" y="205" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-weight="700" font-size="30" letter-spacing="0.5">TikTok</text>
    </g>
  </g>
</svg>
