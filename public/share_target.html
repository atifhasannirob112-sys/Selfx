<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Post to GrowGram</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Hind+Siliguri:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', 'Hind Siliguri', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
    }
    .overlay-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.72);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      z-index: 1000;
      animation: fadeIn 0.18s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .top-dismiss-area {
      flex: 1;
      width: 100%;
      cursor: pointer;
    }
    .bottom-sheet {
      width: 100%;
      background: linear-gradient(180deg, #13151b 0%, #0a0b0e 100%);
      border-top-left-radius: 26px;
      border-top-right-radius: 26px;
      padding: 12px 20px 24px 20px;
      color: #ffffff;
      box-shadow: 0 -12px 48px rgba(0, 0, 0, 0.9), 0 -1px 0 rgba(255, 255, 255, 0.08);
      border-top: 1px solid rgba(250, 204, 21, 0.2);
      animation: slideUp 0.24s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      position: relative;
    }
    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
    .handle-bar {
      width: 44px;
      height: 4.5px;
      background: #3f3f46;
      border-radius: 9999px;
      margin: 0 auto 14px auto;
    }
    .sheet-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .sheet-title-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .app-icon-badge {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      background: linear-gradient(135deg, #facc15 0%, #ca8a04 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 10px rgba(250, 204, 21, 0.35);
    }
    .app-icon-badge svg {
      width: 18px;
      height: 18px;
      fill: #000000;
    }
    .sheet-title {
      font-size: 18px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -0.3px;
    }
    .close-btn {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: #27272a;
      border: 1px solid #3f3f46;
      color: #a1a1aa;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s;
    }
    .close-btn:active {
      transform: scale(0.92);
      background: #3f3f46;
      color: #ffffff;
    }
    .active-badge-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .section-label {
      font-size: 11px;
      font-weight: 700;
      color: #9ca3af;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .model-badge {
      font-size: 11px;
      font-weight: 700;
      color: #facc15;
      background: rgba(250, 204, 21, 0.12);
      border: 1px solid rgba(250, 204, 21, 0.3);
      padding: 3px 9px;
      border-radius: 9999px;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .model-selector-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 8px 0 16px 0;
      overflow-x: auto;
      padding-bottom: 6px;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }
    .model-selector-row::-webkit-scrollbar {
      display: none;
    }
    .model-chip {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px 6px 6px;
      background: #181a20;
      border: 1.5px solid #2e323d;
      border-radius: 9999px;
      font-size: 12.5px;
      color: #d1d5db;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.18s cubic-bezier(0.16, 1, 0.3, 1);
      flex-shrink: 0;
    }
    .model-chip:active {
      transform: scale(0.96);
    }
    .model-chip.active {
      background: rgba(250, 204, 21, 0.14);
      border-color: #facc15;
      color: #facc15;
      font-weight: 700;
      box-shadow: 0 0 16px rgba(250, 204, 21, 0.2);
    }
    .model-chip img {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      object-cover: cover;
      border: 1.5px solid rgba(255, 255, 255, 0.15);
    }
    .video-card {
      background: #16181f;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .video-card-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .video-icon-ring {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: rgba(250, 204, 21, 0.12);
      border: 1px solid rgba(250, 204, 21, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #facc15;
    }
    .video-info-title {
      font-size: 14.5px;
      font-weight: 700;
      color: #f3f4f6;
    }
    .video-info-sub {
      font-size: 11px;
      color: #9ca3af;
      margin-top: 2px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .badge-hd {
      background: #22c55e;
      color: #000000;
      font-size: 9px;
      font-weight: 800;
      padding: 1px 5px;
      border-radius: 4px;
      letter-spacing: 0.3px;
    }
    .check-circle {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #facc15;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(250, 204, 21, 0.4);
    }
    .check-circle svg {
      width: 14px;
      height: 14px;
      stroke: #000000;
      stroke-width: 3.5;
    }
    .link-pill-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #0f1015;
      border: 1px solid #27272a;
      border-radius: 10px;
      padding: 7px 10px;
      margin-bottom: 16px;
      font-size: 11px;
      color: #9ca3af;
      overflow: hidden;
    }
    .link-pill-bar span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .btn-post-yellow {
      width: 100%;
      background: linear-gradient(135deg, #facc15 0%, #eab308 100%);
      color: #000000;
      font-size: 16px;
      font-weight: 800;
      padding: 14px;
      border-radius: 9999px;
      border: none;
      cursor: pointer;
      box-shadow: 0 6px 24px rgba(250, 204, 21, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.16s ease;
      letter-spacing: 0.2px;
    }
    .btn-post-yellow:active {
      transform: scale(0.98);
      box-shadow: 0 2px 10px rgba(250, 204, 21, 0.3);
    }
    .btn-post-yellow:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      box-shadow: none;
    }
    .spinner {
      width: 18px;
      height: 18px;
      border: 2.5px solid rgba(0, 0, 0, 0.25);
      border-top-color: #000000;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .status-toast {
      display: none;
      margin-top: 12px;
      padding: 11px 14px;
      border-radius: 14px;
      font-size: 13px;
      font-weight: 700;
      text-align: center;
    }
    .status-toast.success {
      display: block;
      background: rgba(34, 197, 94, 0.15);
      color: #4ade80;
      border: 1px solid rgba(34, 197, 94, 0.35);
    }
    .status-toast.error {
      display: block;
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.35);
    }
    .return-tiktok-btn {
      display: none;
      width: 100%;
      margin-top: 10px;
      padding: 12px;
      background: #27272a;
      border: 1px solid #3f3f46;
      border-radius: 9999px;
      color: #ffffff;
      font-size: 13.5px;
      font-weight: 700;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .return-tiktok-btn.show {
      display: flex;
    }
  </style>
</head>
<body>
  <div class="overlay-backdrop">
    <!-- Click anywhere in top region to dismiss and return directly to TikTok -->
    <div class="top-dismiss-area" onclick="closeSheet()"></div>

    <!-- Floating Bottom Sheet -->
    <div class="bottom-sheet" id="bottomSheet">
      <div class="handle-bar"></div>

      <!-- Sheet Header -->
      <div class="sheet-header">
        <div class="sheet-title-group">
          <div class="app-icon-badge">
            <svg viewBox="0 0 24 24">
              <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
            </svg>
          </div>
          <div>
            <div class="sheet-title">Post to GrowGram</div>
          </div>
        </div>

        <button class="close-btn" onclick="closeSheet()" aria-label="Close">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>

      <!-- Auto-Post Status Banner (No model selection required) -->
      <div class="video-card">
        <div class="video-card-left">
          <div class="video-icon-ring">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
              <polygon points="5 3 19 12 5 21 5 3"/>
            </svg>
          </div>
          <div>
            <div class="video-info-title">MP4 Video Reel (Auto-Post)</div>
            <div class="video-info-sub">
              <span class="badge-hd">FULL HD 1080P</span>
              <span>• অরিজিনাল অডিও সহ স্বয়ংক্রিয় আপলোড</span>
            </div>
          </div>
        </div>
        <div class="check-circle">
          <svg viewBox="0 0 24 24" fill="none">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
        </div>
      </div>

      <!-- Shared Video Link Box -->
      <div class="link-pill-bar">
        <span>🔗</span>
        <span id="urlDisplay">ভিডিও লিঙ্ক লোড হচ্ছে...</span>
      </div>

      <!-- Primary Action Button -->
      <button class="btn-post-yellow" id="postBtn" onclick="executePost()">
        <span id="btnIcon">⚡</span>
        <span id="btnText">GrowGram-এ পোস্ট হচ্ছে...</span>
      </button>

      <!-- Status Toast -->
      <div class="status-toast" id="statusToast"></div>

      <!-- Direct Return to TikTok Button -->
      <a href="tiktok://" class="return-tiktok-btn show" id="returnTikTokBtn" onclick="closeSheet()">
        <span>📱</span>
        <span>টিকটকে ফিরে যান (TikTok)</span>
      </a>
    </div>
  </div>

  <script>
    let targetUrl = '';
    let currentModel = null;
    let availableModels = [];

    // Fallback default models if localStorage or server is empty
    const DEFAULT_SYSTEM_MODELS = [
      {
        id: 'hamza_malik',
        name: 'Hamza Malik',
        handle: '@hamza_malik',
        avatar: '/assets/models/hamza_malik.jpg'
      },
      {
        id: 'zaviyar_nauman',
        name: 'Zaviyar Nauman',
        handle: '@zaviyar_nauman',
        avatar: '/assets/models/zaviyar_nauman.jpg'
      },
      {
        id: 'daniyal_zafar',
        name: 'Daniyal Zafar',
        handle: '@daniyal_zafar',
        avatar: '/assets/models/daniyal_zafar.jpg'
      },
      {
        id: 'bilal_abbas',
        name: 'Bilal Abbas',
        handle: '@bilal_abbas',
        avatar: '/assets/models/bilal_abbas.jpg'
      },
      {
        id: 'shahzad_noor',
        name: 'Shahzad Noor',
        handle: '@shahzad_noor',
        avatar: '/assets/models/shahzad_noor.jpg'
      },
      {
        id: 'zarrar_khan',
        name: 'Zarrar Khan',
        handle: '@zarrar_khan',
        avatar: '/assets/models/zarrar_khan.jpg'
      },
      {
        id: 'niromax',
        name: 'Atif Nirob',
        handle: '@niromax',
        avatar: 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=400&q=80'
      }
    ];

    // Load URL from query parameters if not injected by server
    try {
      const params = new URLSearchParams(window.location.search);
      const rawUrl = params.get('url') || params.get('text') || params.get('title') || '';
      if (rawUrl && !targetUrl) {
        const match = rawUrl.match(/https?:\/\/[^\s]+/i);
        targetUrl = match ? match[0] : rawUrl.trim();
      }
    } catch (e) {}

    // Display URL
    const urlDisplay = document.getElementById('urlDisplay');
    if (targetUrl) {
      urlDisplay.innerText = targetUrl;
    } else {
      urlDisplay.innerText = 'কোনো ভিডিও লিঙ্ক পাওয়া যায়নি';
    }

    // Automatically pick creator model silently without user interaction
    function autoSelectModel() {
      let models = [];
      try {
        const localSaved = localStorage.getItem('selfx_custom_ai_personas');
        if (localSaved) {
          const parsed = JSON.parse(localSaved);
          if (Array.isArray(parsed) && parsed.length > 0) {
            models = parsed;
          }
        }
      } catch (e) {}

      if (models.length === 0 && typeof serverSavedModels !== 'undefined' && Array.isArray(serverSavedModels) && serverSavedModels.length > 0) {
        models = serverSavedModels;
      }

      if (models.length === 0) {
        models = DEFAULT_SYSTEM_MODELS;
      }

      availableModels = models;
      // Auto-select primary model (Atif Nirob / niromax or first saved persona)
      currentModel = availableModels[0] || { id: 'niromax', name: 'Atif Nirob', handle: 'niromax' };

      // Background sync from server
      fetch('/api/community/personas')
        .then(res => res.json())
        .then(data => {
          if (data && data.success && Array.isArray(data.personas) && data.personas.length > 0) {
            availableModels = data.personas;
            currentModel = availableModels[0];
          }
        })
        .catch(() => {});
    }

    // Function to close and return directly to TikTok without entering GrowGram
    function closeSheet() {
      // 1. Attempt to launch TikTok directly via intent/deep link
      try {
        window.location.href = 'tiktok://';
      } catch (e) {}

      // 2. Browser history back or close
      setTimeout(() => {
        try {
          if (window.history.length > 1) {
            window.history.back();
          } else {
            window.close();
          }
        } catch (e) {
          window.close();
        }
      }, 100);
    }

    async function persistPostAndVideoLocally(post, videoUrl) {
      if (post) {
        try {
          const rawPerm = localStorage.getItem('selfx_permanent_tiktok_posts');
          const permList = rawPerm ? JSON.parse(rawPerm) : [];
          localStorage.setItem('selfx_permanent_tiktok_posts', JSON.stringify([post, ...permList.filter(p => p && p.id !== post.id)]));

          const rawLocal = localStorage.getItem('selfx_user_local_posts');
          const localList = rawLocal ? JSON.parse(rawLocal) : [];
          localStorage.setItem('selfx_user_local_posts', JSON.stringify([post, ...localList.filter(p => p && p.id !== post.id)]));
        } catch (e) {}
      }

      if (videoUrl && videoUrl.startsWith('/media/') && window.indexedDB) {
        try {
          const vRes = await fetch(videoUrl, { cache: 'no-store' });
          if (vRes.ok) {
            const ct = (vRes.headers.get('content-type') || '').toLowerCase();
            if (!ct.includes('text/html') && !ct.includes('application/json')) {
              const blob = await vRes.blob();
              if (blob && blob.size > 15000) {
                const cleanId = videoUrl.replace(/^\/media\//, '').replace(/\.[^.]+$/, '');
                await new Promise((resolve) => {
                  const req = indexedDB.open('glowup_media_db_v4', 2);
                  req.onupgradeneeded = () => {
                    const db = req.result;
                    if (!db.objectStoreNames.contains('glowup_media_store_v4')) {
                      db.createObjectStore('glowup_media_store_v4', { keyPath: 'id' });
                    }
                  };
                  req.onsuccess = () => {
                    try {
                      const db = req.result;
                      const tx = db.transaction('glowup_media_store_v4', 'readwrite');
                      const store = tx.objectStore('glowup_media_store_v4');
                      const now = Date.now();
                      store.put({ id: cleanId, blob, updatedAt: now });
                      store.put({ id: videoUrl, blob, updatedAt: now });
                      if (post && post.id) store.put({ id: post.id, blob, updatedAt: now });
                      tx.oncomplete = () => resolve(true);
                      tx.onerror = () => resolve(false);
                    } catch (e) { resolve(false); }
                  };
                  req.onerror = () => resolve(false);
                });
              }
            }
          }
        } catch (e) {}
      }
    }

    // Main Post Action
    async function executePost() {
      if (!targetUrl) {
        showToast('error', 'কোনো ভিডিও লিঙ্ক পাওয়া যায়নি');
        return;
      }

      const postBtn = document.getElementById('postBtn');
      const btnText = document.getElementById('btnText');
      const btnIcon = document.getElementById('btnIcon');
      postBtn.disabled = true;
      btnIcon.innerHTML = '<div class="spinner"></div>';
      btnText.innerText = 'GrowGram-এ স্বয়ংক্রিয়ভাবে আপলোড হচ্ছে...';

      try {
        const res = await fetch('/api/share/quick-post', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            url: targetUrl,
            mode: 'video',
            model: currentModel || { id: 'niromax', name: 'Atif Nirob', handle: 'niromax' }
          })
        });

        const data = await res.json();
        if (!res.ok || !data.success) {
          throw new Error(data.error || 'পোস্ট করতে সমস্যা হয়েছে');
        }

        // Persist post metadata & MP4 Blob locally on device before returning to TikTok
        await Promise.race([
          persistPostAndVideoLocally(data.post, data.videoUrl || (data.post && data.post.video)),
          new Promise(r => setTimeout(r, 2500))
        ]);

        showToast('success', '✓ GrowGram-এ সফলভাবে পোস্ট সম্পন্ন হয়েছে! টিকটকে ফিরে যাওয়া হচ্ছে... 🚀');
        btnIcon.innerHTML = '✓';
        btnText.innerText = 'পোস্ট সফল!';
        postBtn.style.background = 'linear-gradient(135deg, #10b981 0%, #059669 100%)';
        postBtn.style.color = '#ffffff';

        // Direct return to TikTok app after 750ms so user stays in TikTok!
        setTimeout(() => {
          closeSheet();
        }, 750);
      } catch (err) {
        console.error(err);
        showToast('error', err.message || 'নেটওয়ার্ক সমস্যা, আবার চেষ্টা করুন');
        postBtn.disabled = false;
        btnIcon.innerText = '🔄';
        btnText.innerText = 'আবার পোস্ট করুন';
      }
    }

    function showToast(type, msg) {
      const toast = document.getElementById('statusToast');
      toast.className = 'status-toast ' + type;
      toast.innerText = msg;
    }

    // Initialize model & Auto-execute post if targetUrl is present
    autoSelectModel();

    if (targetUrl) {
      // Auto-trigger post after a brief 400ms preview so user doesn't even need to click
      setTimeout(() => {
        executePost();
      }, 400);
    }
  </script>
</body>
</html>
